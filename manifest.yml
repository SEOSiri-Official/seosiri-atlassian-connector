modules:
  jira:issuePanel:
    - key: seosiri-universal-mcp-panel
      function: panel-fn
      title: SEOSiri Model Context Protocol (MCP) Suite
      icon: https://developers.seosiri.com/favicon.svg
  jira:adminPage:
    - key: seosiri-admin-settings
      function: admin-fn
      title: SEOSiri Enterprise Control Plane
  function:
    - key: panel-fn
      handler: index.runPanel
    - key: admin-fn
      handler: index.runAdmin
app:
  id: ari:cloud:ecosystem::app/94d9dd77-f80c-4e65-91e7-59f273592f96
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - "*.seosiri.com"
        - "seosiri.com"
        - "developers.seosiri.com"
        - "iaig.seosiri.com"
        - "biopharma.seosiri.com"
        - "bioassay.seosiri.com"
        - "aeo.seosiri.com"
        - "schema.seosiri.com"
        - "dns.seosiri.com"
        - "keywords.seosiri.com"
        - "governance.seosiri.com"
        - "entity.seosiri.com"
        - "ops.seosiri.com"
        - "db.seosiri.com"
        - "hubappapi.seosiri.com"
        - "mcp.seosiri.com"
