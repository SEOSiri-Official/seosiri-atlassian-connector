modules:
  jira:adminPage:
    - key: seosiri-admin-settings
      title: SEOSiri Enterprise Control Plane
      resource: main-ui
      render: native
  jira:issuePanel:
    - key: seosiri-universal-mcp-panel
      title: SEOSiri Model Context Protocol (MCP) Suite
      resource: main-ui
      render: native
      icon: https://developers.seosiri.com/favicon.svg
resources:
  - key: main-ui
    path: src/frontend/index.jsx
app:
  id: ari:cloud:ecosystem::app/c1152781-3215-472c-82eb-b7f9ac202cd1
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
  external:
    fetch:
      backend:
        - address: "*.seosiri.com"
        - address: seosiri.com
        - address: developers.seosiri.com
        - address: rovomcp.seosiri.com
        - address: iaig.seosiri.com
        - address: biopharma.seosiri.com
        - address: bioassay.seosiri.com
        - address: aeo.seosiri.com
        - address: schema.seosiri.com
        - address: dns.seosiri.com
        - address: keywords.seosiri.com
        - address: governance.seosiri.com
        - address: entity.seosiri.com
        - address: ops.seosiri.com
        - address: db.seosiri.com
        - address: hubappapi.seosiri.com
        - address: vscode.seosiri.com
        - address: mcp.seosiri.com
